name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jump-king-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.3.4'
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/chat.spec.ts e2e/chat-controls.spec.ts e2e/cheat.spec.ts --reporter=line
      - run: pnpm build:cloudflare
      - name: Package backend
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          pnpm --filter game-server deploy --prod "$RUNNER_TEMP/backend-runtime"
          printf '%s\n' "$DEPLOY_REVISION" > "$RUNNER_TEMP/backend-runtime/build/revision.txt"
          mkdir -p "$RUNNER_TEMP/backend-artifact"
          tar -czf "$RUNNER_TEMP/backend-artifact/backend.tar.gz" \
            -C "$RUNNER_TEMP/backend-runtime" build node_modules package.json
          cp deploy/ec2/apply-backend.sh "$RUNNER_TEMP/backend-artifact/apply-backend.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend
          path: ${{ runner.temp }}/backend-artifact/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend
          path: apps/web/dist/
          retention-days: 1
          if-no-files-found: error

  deploy-backend:
    needs: build
    runs-on: [self-hosted, Linux, X64, jump-king-production]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend
          path: ${{ runner.temp }}/backend-artifact/
      - name: Deploy backend with rollback
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          bash "$RUNNER_TEMP/backend-artifact/apply-backend.sh" \
            "$RUNNER_TEMP/backend-artifact/backend.tar.gz" "$DEPLOY_REVISION"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://jumpking-lighthouse2815.duckdns.org/health

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          packageManager: npm
          command: pages deploy dist --project-name jump-king-web --branch main --commit-hash ${{ github.sha }}
      - name: Verify production
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://jump-king-web.pages.dev/ --output /dev/null
